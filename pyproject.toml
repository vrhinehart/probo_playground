[project]
name = "probo-playground"
version = "0.1.0"
description = "A simulation environment for a mobile robot operating in two dimensions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "pytest",
    "PyYAML",
    "scipy",
]

[tool.pytest.ini_options]
testpaths = ["test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probo_sim"]